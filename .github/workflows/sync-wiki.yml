name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs/wiki to GitHub Wiki
        run: |
          set -e

          # 配置 git 身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          # 先检测 Wiki 仓库是否可访问（尝试两种认证格式）
          echo "Checking wiki repository: https://github.com/${REPO}.wiki.git"

          WIKI_URL_1="https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git"
          WIKI_URL_2="https://${TOKEN}@github.com/${REPO}.wiki.git"

          WIKI_URL=""
          for URL in "$WIKI_URL_1" "$WIKI_URL_2"; do
            echo "Trying authentication format..."
            if git ls-remote "$URL" > /tmp/git_ls_remote.log 2>&1; then
              WIKI_URL="$URL"
              echo "✅ Wiki repository is accessible."
              break
            else
              echo "Failed with this format:"
              cat /tmp/git_ls_remote.log
            fi
          done

          if [ -z "$WIKI_URL" ]; then
            echo ""
            echo "❌ Wiki 仓库无法访问。可能的原因："
            echo "   1. Wiki 功能未启用：https://github.com/${REPO}/settings/wiki"
            echo "   2. Wiki 虽已启用，但还没有初始化。请先在 Wiki 页面手动创建第一个页面（例如 Home），保存后再运行本 workflow。"
            echo "   3. GITHUB_TOKEN 权限不足（需要 contents: write）。"
            echo ""
            exit 1
          fi

          # 克隆 Wiki 仓库
          git clone "$WIKI_URL" wiki-repo
          cd wiki-repo

          # 清空旧文件（保留 .git），-mindepth 1 避免匹配 . 和 ..
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # 复制 docs/wiki 下所有 .md 文件（保留子目录）
          cp -R ../docs/wiki/* .

          # 提交并推送
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to sync."
          else
            git commit -m "sync wiki from docs/wiki ($(date -u +%Y-%m-%d %H:%M:%S UTC))"
            git push
            echo "Wiki synced successfully."
          fi
