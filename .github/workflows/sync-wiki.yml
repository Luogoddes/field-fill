name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs/wiki to GitHub Wiki
        run: |
          set -e

          # 配置 git 身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPO="${{ github.repository }}"
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.wiki.git"

          # 先检测 Wiki 仓库是否可访问（未启用 Wiki 时克隆会 404）
          echo "Checking wiki repository..."
          if ! git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo ""
            echo "❌ Wiki 仓库无法访问。请先在 GitHub 仓库设置中启用 Wiki："
            echo "   https://github.com/${REPO}/settings/wiki"
            echo ""
            echo "启用后重新运行本 workflow 即可。"
            exit 1
          fi

          # 克隆 Wiki 仓库
          git clone "$WIKI_URL" wiki-repo
          cd wiki-repo

          # 清空旧文件（保留 .git）
          find . -maxdepth 1 ! -name '.git' \( -type f -o -type d \) -exec rm -rf {} +

          # 复制 docs/wiki 下所有 .md 文件（保留子目录）
          cp -R ../docs/wiki/* .

          # 提交并推送
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to sync."
          else
            git commit -m "sync wiki from docs/wiki ($(date -u +%Y-%m-%d %H:%M:%S UTC))"
            git push
            echo "Wiki synced successfully."
          fi
