name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs/wiki to GitHub Wiki
        run: |
          # 配置 git 身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 克隆 Wiki 仓库（需先在 Settings → Wiki 中启用）
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          git clone "$WIKI_URL" wiki-repo

          # 清空旧文件（保留 .git）
          cd wiki-repo
          find . -maxdepth 1 ! -name '.git' -type f -delete
          find . -maxdepth 1 ! -name '.git' -type d -exec rm -rf {} +

          # 复制 docs/wiki 下所有 .md 文件（保留子目录）
          cp -R ../docs/wiki/* .

          # 提交并推送
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to sync."
          else
            git commit -m "sync wiki from docs/wiki ($(date -u +%Y-%m-%d %H:%M:%S UTC))"
            git push
            echo "Wiki synced successfully."
          fi
